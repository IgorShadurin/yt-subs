name: Swift
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test Chrome extension
        run: node --test extension/tests.cjs
      - name: Test
        run: swift test
      - name: Build app
        run: ./scripts/build-app.sh
